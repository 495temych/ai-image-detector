name: mlops-img
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - pip
  - pip:
    - mlflow
    - dvc[ssh]
    - fastapi
    - "uvicorn[standard]"
    - streamlit
    - kaggle
    - scikit-learn
    - pillow
    - onnx
    - onnxruntime
    - python-multipart
    - boto3
    - python-dotenv
    - opencv-python-headless
    - pydantic>=2.0.0
    - numpy
