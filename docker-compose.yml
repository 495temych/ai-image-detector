services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .           # repo root — required so COPY picture_samples/ works
      dockerfile: ui/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./ui/data:/app/data   # persists SQLite DB across restarts
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
