services:

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000   # reaches the api service by its compose service name
    depends_on:
      - api
    volumes:
      - feedback-data:/app/feedback  # persists user feedback and uploaded images across restarts

volumes:
  feedback-data:
