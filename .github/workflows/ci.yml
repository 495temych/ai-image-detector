# ──────────────────────────────────────────────────────────────────────────────
# CI / CD — ai-image-detector
#
# CI jobs (lint + test) run on every push and pull-request to main.
# CD job (docker) only fires on a direct push to main after CI passes.
# ──────────────────────────────────────────────────────────────────────────────
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows manual trigger on any branch

# Cancel any in-flight run for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # CI — runs on every push & PR
  # ────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check Python style
        run: ruff check src/ api/ tests/

  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Only the packages needed by the unit tests — no torch, no dagshub.
        # Heavy MLOps imports are lazy (inside main()/run_evaluation()) so they
        # are never triggered during the test run.
        run: |
          pip install \
            "fastapi>=0.111.0" \
            "scikit-learn>=1.5.0" \
            "Pillow>=10.0.0" \
            "numpy>=1.26.0,<2.0" \
            "python-multipart>=0.0.9" \
            "pydantic>=2.0.0" \
            pytest \
            httpx

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────
  # CD — only on push to main, after CI passes
  # ────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: api/
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-image-detector-api:latest
            ghcr.io/${{ github.repository_owner }}/ai-image-detector-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── UI image ───────────────────────────────────────────────
      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ui/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-image-detector-ui:latest
            ghcr.io/${{ github.repository_owner }}/ai-image-detector-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
