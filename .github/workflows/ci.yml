name: MLOps Pipeline

on:
  push:
    branches: [main]

env:
  DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.run_eval.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user 495temych
          dvc remote modify dagshub --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull dataset from DagsHub
        run: dvc pull data/processed.dvc

      - name: Run evaluation
        id: run_eval
        run: |
          python src/evaluate.py --config configs/eval_config.yaml
          echo "run_id=$(cat mlflow_run_id.txt)" >> $GITHUB_OUTPUT

      - name: Upload run_id artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-id
          path: mlflow_run_id.txt

  register:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Download run_id
        uses: actions/download-artifact@v4
        with:
          name: mlflow-run-id

      - name: Register and promote model
        run: |
          python src/register.py \
            --config configs/eval_config.yaml \
            --run-id $(cat mlflow_run_id.txt)

  export:
    needs: register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Export ONNX model
        run: |
          python src/export_onnx.py \
            --config configs/eval_config.yaml \
            --output-dir .

      - name: Upload ONNX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            model.onnx
            labels.json

  docker:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: api/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api/
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-image-detector-api:latest
            ghcr.io/${{ github.repository_owner }}/ai-image-detector-api:${{ github.sha }}
